name: Discord /ufc
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Requested ET date; blank slate advances to next UFC card'
        required: true
      relay:
        description: 'Encrypted short-lived Discord interaction'
        required: true
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATE: ${{ inputs.date }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decrypt interaction
        env:
          RELAY_PAYLOAD: ${{ inputs.relay }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: node scripts/discord-relay.mjs decrypt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ufc/requirements.txt
      - run: pip install -r ufc/requirements.txt
      - name: Download current history, refit and freeze forecasts
        run: python -m ufc.run forecast --date "$DATE"
      - name: Scan current Polymarket prices after the freeze
        run: python -m ufc.run scan
      - name: Deliver with fresh kickoff and quote-age checks
        run: node ufc/deliver.mjs
      - name: Preserve successfully delivered prospective forecasts
        if: success()
        run: python -m ufc.run learn
      - name: Report failure
        if: failure() && env.INTERACTION_TOKEN != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/discord-relay.mjs fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufc-record-${{ github.run_id }}
          path: |
            out/ufc/
            ufc/data/source.json
            ufc/data/publications.json
          retention-days: 90
