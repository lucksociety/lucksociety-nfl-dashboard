name: Weekly data refresh

# Rebuilds the v6 model inputs from nflverse every Tuesday 10:00 AM ET (after Monday Night Football)
# and on demand. Commits data/ only when something changed. No betting data is downloaded or used.
on:
  schedule:
    - cron: '0 14 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements.txt
      - name: Download nflverse data, rebuild aggregates, export per-week inputs, validate JS port
        run: python scripts/update_data.py --validate
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data tests/validation.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: weekly refresh $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          git push
