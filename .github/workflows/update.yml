name: Daily data refresh

# Rebuilds the v6 model inputs from nflverse daily and on demand. Commits data/ only when something changed. No betting data is downloaded or used.
on:
  push:
    branches: [main]
    paths:
      - scripts/update_data.py
      - model/data.py
      - model/season.py
      - .github/workflows/update.yml
  schedule:
    - cron: '19 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: model/pbp*.parquet
          key: nfl-history-${{ github.run_id }}
          restore-keys: nfl-history-
      - run: pip install -r requirements.txt
      - name: Download nflverse data, rebuild aggregates, export per-week inputs, validate JS port
        run: python scripts/update_data.py --validate
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data tests/validation.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: daily refresh $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
