name: UFC daily refresh and learning
on:
  schedule:
    - cron: '45 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ufc/**, .github/workflows/ufc-learning.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: ufc-daily-learning
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ufc/requirements.txt
      - run: pip install -r ufc/requirements.txt
      - name: Grade delivered cards, refresh history and refit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OMP_NUM_THREADS: '2'
        run: python -m ufc.learning
      - name: Preserve permanent record and diagnostics
        run: |
          cp out/ufc/evaluation.json ufc/data/evaluation.json
          cp out/ufc/model.json ufc/data/model.json
          git config user.name model-learning-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ufc/data/publications.json ufc/data/learning.json ufc/data/learning-state.json ufc/data/evaluation.json ufc/data/model.json
          if ! git diff --cached --quiet; then
            git commit -m 'ufc: daily prospective grading and input refresh'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufc-daily-${{ github.run_id }}
          path: |
            out/ufc/
            ufc/data/learning.json
          retention-days: 90
