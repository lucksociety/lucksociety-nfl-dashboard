# One-off probe: build the college basketball dashboard data on this branch only.
name: probe cbb site
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: cbb/requirements.txt }
      - run: pip install -r cbb/requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            cbb/data/*.parquet
          key: cbb-results-v1-${{ github.run_id }}
          restore-keys: cbb-results-v1-
      - run: python -m cbb.site --days 3
      - if: always()
        run: |
          git config user.name model-learning-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cbb/site/data || true
          git diff --cached --quiet || (git commit -m "probe: cbb site data" && git push)
