name: Diagnose NFL bet blocking (temporary)
on:
  push:
    branches: [diagnose-nfl-blocks]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NFL_DATA_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: model/pbp*.parquet
          key: nfl-diagnose-${{ github.run_id }}
          restore-keys: |
            nfl-command-history-
            nfl-history-
      - run: pip install -r requirements.txt
      - run: npm ci --prefix discord-bot --ignore-scripts --no-audit --no-fund
      - name: Download current NFL data and rebuild team and QB inputs
        run: python scripts/update_data.py --manifest out/refresh.json
      - name: Run the real pipeline without posting and print why each game is bet or blocked
        env:
          DATES: '2026-11-16,2026-11-22,2026-11-19,2026-11-23'
          NFL_REFRESH_REQUIRED: '1'
        run: node scripts/diagnose-bets.cjs
