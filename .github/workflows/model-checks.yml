name: Model and command checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Offline model and Discord routing regressions
        run: |
          python -m pytest -q tests/test_sim_parity.py
          npm ci --prefix discord-bot --ignore-scripts --no-audit --no-fund
          node --require ./discord-bot/test/offline.cjs discord-bot/test/payload.test.js 2026-10-29 2026-11-01
          node discord-bot/test/date.test.js
          node discord-bot/test/bet-policy.test.js
          node discord-bot/test/pregame.test.js
          node discord-bot/test/probability-certainty.test.js
          node discord-bot/test/score-consistency.test.js
          node discord-bot/test/live-refresh.test.js
          node discord-bot/test/availability-recovery.test.js
          node discord-bot/test/official-injuries.test.js
          node discord-bot/test/selection-freshness.test.js
          node discord-worker/worker.test.mjs
          node scripts/test-discord-delivery.mjs
      - name: Prospective evaluation regressions
        run: |
          python3 -m unittest discover -s scripts -p test_model_learning.py
          python3 -m unittest discover -s scripts -p test_bet_learning.py
      - name: Evergreen data and reconciliation regressions
        run: python3 -m unittest discover -s scripts -p test_evergreen.py

      - name: Discord delivery recovery regressions
        run: node scripts/discord-delivery.test.mjs
