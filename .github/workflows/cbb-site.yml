name: College basketball dashboard data
# Rebuilds the forecasts shown on the college basketball page (cbb/index.html) for today and tomorrow, Eastern time.
# Same model run as /cbb, without the price scan or any Discord delivery. Writes cbb/site/data/ only.
on:
  schedule:
    - cron: '20 13,16,19,22 * * *'   # 8:20 am, 11:20 am, 2:20 pm, 5:20 pm ET in winter
    - cron: '20 1 * * *'             # 8:20 pm ET
  workflow_dispatch:
  push:
    branches: [main]
    paths: [cbb/site.py, .github/workflows/cbb-site.yml]
permissions:
  contents: write
concurrency:
  group: cbb-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cbb/requirements.txt
      - run: pip install -r cbb/requirements.txt
      - name: Cache result history only (never forecasts, availability, or prices)
        uses: actions/cache@v4
        with:
          path: |
            cbb/data/*.parquet
          key: cbb-results-v1-${{ github.run_id }}
          restore-keys: cbb-results-v1-
      - name: Refresh inputs, refit, simulate and write the page data
        run: python -m cbb.site --days 2
      - name: Publish page data
        if: always()
        run: |
          git config user.name model-learning-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cbb/site/data
          if ! git diff --cached --quiet; then
            git commit -m 'cbb: dashboard forecasts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
